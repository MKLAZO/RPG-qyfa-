<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pharmacy Quest 8-Bit</title>
    
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #202028;
            --panel: #2d2d3a;
            --accent: #66ccff;
            --success: #99cc33;
            --danger: #ff3333;
            --lock: #555566;
            --text: #e0e0e0;
            --gold: #ffcc00;
            --pixel-border: 4px;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 0;
            padding-bottom: 90px;
            font-size: 18px;
        }

        /* --- UI ELEMENTS --- */
        .pixel-box {
            background: var(--panel);
            border: 4px solid var(--bg);
            box-shadow: 
                -4px 0 0 0 white,
                4px 0 0 0 white,
                0 -4px 0 0 white,
                0 4px 0 0 white;
            margin: 15px;
            padding: 15px;
            position: relative;
        }
        
        .pixel-btn {
            font-family: 'VT323', monospace;
            background: var(--accent);
            color: #000;
            border: none;
            border-top: 4px solid white;
            border-left: 4px solid white;
            border-right: 4px solid #005580;
            border-bottom: 4px solid #005580;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }
        .pixel-btn:active { transform: translateY(4px); border:none; }
        .btn-red { background: var(--danger); border-right-color: #990000; border-bottom-color: #990000; }
        .btn-green { background: var(--success); border-right-color: #4d6600; border-bottom-color: #4d6600; }

        /* --- HEADER --- */
        .header {
            text-align: center;
            padding: 20px;
            background: #000;
            border-bottom: 4px solid white;
        }
        .header h1 { margin: 0; font-size: 2.5rem; color: var(--gold); text-shadow: 4px 4px #ff3333; letter-spacing: 2px; }

        /* --- VIEWS --- */
        .view { display: none; }
        .view.active { display: block; }

        /* --- MALLA / MAPA --- */
        .semester-block { margin-bottom: 30px; }
        .sem-title { 
            text-align: center; background: #000; color: white; 
            display: inline-block; padding: 5px 15px; margin-left: 15px;
            transform: translateY(15px); position: relative; z-index: 2;
        }
        
        .course-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px; border-bottom: 2px dashed #444;
            cursor: pointer;
        }
        .course-status { font-size: 1.5rem; width: 30px; text-align: center; }
        .course-info { flex: 1; }
        .course-code { font-size: 0.9rem; color: #888; }
        .course-name { font-size: 1.1rem; line-height: 1.1; }

        /* Estados */
        .st-locked { color: var(--lock); opacity: 0.6; }
        .st-available { color: white; animation: blink 2s infinite; }
        .st-passed { color: var(--success); text-decoration: line-through; opacity: 0.7; }
        .st-active { color: var(--accent); font-weight: bold; background: rgba(102, 204, 255, 0.1); }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* --- DASHBOARD --- */
        .hp-bar-container {
            height: 20px; background: #000; border: 2px solid white; margin-top: 5px; position: relative;
        }
        .hp-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.5s; }
        .hp-text { position: absolute; width: 100%; text-align: center; top: -2px; font-size: 0.9rem; color: white; text-shadow: 1px 1px #000; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: none; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        
        .modal-box {
            background: #202028; border: 4px solid white;
            width: 90%; max-height: 90vh; overflow-y: auto;
            padding: 20px; position: relative;
        }
        
        input {
            background: #000; color: var(--success); border: 2px solid #555;
            font-family: 'VT323'; font-size: 1.2rem; padding: 10px; width: 100%; margin-bottom: 10px;
        }

        /* --- NAVBAR --- */
        .navbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #000; border-top: 4px solid white;
            display: flex; justify-content: space-around; padding: 10px;
            z-index: 50;
        }
        .nav-btn {
            background: none; border: none; color: #555; font-size: 2rem; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); transform: scale(1.2); text-shadow: 0 0 10px var(--accent); }

    </style>
</head>
<body>

    <div class="header">
        <h1>PHARMACY QUEST</h1>
        <div style="font-size: 1rem; color: #888;">PLAYER: CARRILLO</div>
    </div>

    <div id="view-active" class="view active">
        <div style="text-align:center; padding:20px;">
            <h2 style="color:var(--accent)">> MISIONES ACTIVAS</h2>
        </div>
        <div id="active-container"></div>
        
        <div style="padding:20px;">
            <button class="pixel-btn btn-red" onclick="finishSemester()">TERMINAR NIVEL (Cerrar Semestre)</button>
        </div>
    </div>

    <div id="view-map" class="view">
        <div style="text-align:center; padding:20px;">
            <h2 style="color:var(--gold)">> MAPA DEL MUNDO</h2>
            <small>Toca una misión para equiparla</small>
        </div>
        <div id="map-container"></div>
        
        <div style="padding:50px 20px 20px 20px; text-align:center;">
            <button onclick="hardReset()" style="background:none; border:none; color:#555; font-family:'VT323';">REINICIAR CARTUCHO (Borrar todo)</button>
        </div>
    </div>

    <div id="setup-modal" class="modal-overlay">
        <div class="modal-box" style="text-align:center;">
            <h2 style="color:var(--gold)">NUEVA PARTIDA DETECTADA</h2>
            <p>Selecciona los niveles que ya completaste en el pasado:</p>
            <div id="setup-list" style="text-align:left; max-height:300px; overflow-y:scroll; border:2px solid #555; padding:10px; margin-bottom:20px;"></div>
            <button class="pixel-btn btn-green" onclick="finishSetup()">COMENZAR AVENTURA</button>
        </div>
    </div>

    <div id="detail-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="display:flex; justify-content:space-between;">
                <h2 id="d-title" style="margin:0; color:var(--accent)">Nom</h2>
                <button onclick="closeModal()" style="background:red; color:white; border:none; font-family:'VT323'; font-size:1.5rem;">X</button>
            </div>
            <div id="d-code" style="color:#888; margin-bottom:20px;">COD</div>

            <div id="d-grades-section">
                <div class="pixel-box">
                    <div style="text-align:center;">HP ACTUAL (Promedio)</div>
                    <div id="d-avg" style="font-size:3rem; text-align:center; color:white;">--</div>
                </div>

                <div id="d-eval-list"></div>
                <button class="pixel-btn" onclick="addEval()">+ ITEM DE NOTA</button>
                <br><br>
                <button class="pixel-btn btn-red" onclick="dropSubject()">ABANDONAR MISIÓN</button>
            </div>

            <div id="d-enroll-section" style="display:none; text-align:center; padding-top:20px;">
                <p id="d-lock-msg" style="color:var(--danger)"></p>
                <button id="btn-enroll" class="pixel-btn btn-green" onclick="enrollCurrent()">ACEPTAR MISIÓN</button>
                <br><br>
                <button id="btn-force" class="pixel-btn btn-red" style="display:none" onclick="forceEnroll()">☠️ USAR CHEAT CODE (Forzar) ☠️</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <button class="nav-btn active" onclick="switchView('view-active', this)">⚔️</button>
        <button class="nav-btn" onclick="switchView('view-map', this)">🗺️</button>
    </div>

<script>
    // --- BASE DE DATOS CURRICULAR (Completa) ---
    const db = [
        // SEMESTRE 1
        {id:'DQUI1045', name:'Química General', sem:1, req:[]},
        {id:'DBIO1091', name:'Biología Celular', sem:1, req:[]},
        {id:'DCEX0002', name:'Matemática', sem:1, req:[]},
        {id:'FORI0001', name:'Antropología', sem:1, req:[]},
        {id:'QYFAA001', name:'Intro. Cs. Farmacéuticas', sem:1, req:[]},
        {id:'QYFAA002', name:'Psicología General', sem:1, req:[]},
        // SEMESTRE 2
        {id:'DQUI1046', name:'Química Inorgánica', sem:2, req:['DQUI1045']},
        {id:'DCEX0003', name:'Cálculo Diferencial', sem:2, req:['DCEX0002']},
        {id:'DCE0010', name:'Física', sem:2, req:['DCEX0002']},
        {id:'DCEX0005', name:'Bioestadística', sem:2, req:['DCEX0002']},
        {id:'QYFAB001', name:'Fund. Quehacer Farm.', sem:2, req:['QYFAA001']},
        {id:'FORI0002', name:'Ética', sem:2, req:['FORI0001']},
        // SEMESTRE 3
        {id:'DSPU0012', name:'Epidemiología y SP', sem:3, req:['DCEX0005']},
        {id:'DQUI1047', name:'Química Analítica', sem:3, req:['DQUI1046']},
        {id:'DQUI1052', name:'Química Orgánica', sem:3, req:['DQUI1046']},
        {id:'DQUI1053', name:'Fisicoquímica', sem:3, req:['DCE0010']}, // EL FAMOSO TOPE DE FÍSICA
        {id:'DBIO1085', name:'Fisiología Humana', sem:3, req:['DBIO1091']},
        // SEMESTRE 4
        {id:'DSPU0014', name:'Salud Pública', sem:4, req:['DSPU0012']},
        {id:'DQUI1054', name:'Análisis Instrumental', sem:4, req:['DQUI1047']},
        {id:'DQUI1055', name:'Química Orgánica Avanzada', sem:4, req:['DQUI1052']},
        {id:'DBIO1094', name:'Bioquímica General', sem:4, req:['DQUI1052']},
        {id:'DMOR0019', name:'Fisiopatología', sem:4, req:['DBIO1085']},
        // SEMESTRE 5
        {id:'DBIO1097', name:'Farmacología I', sem:5, req:['DMOR0019','DBIO1094']},
        {id:'QYFAE001', name:'Tecnología Farm. I', sem:5, req:['DQUI1053']},
        {id:'QYFAE002', name:'Química Farm. I', sem:5, req:['DQUI1055']},
        {id:'DBIO1095', name:'Microbiología Gral', sem:5, req:['DBIO1094']},
        {id:'FALU0001', name:'Salud Digital', sem:5, req:[]},
        {id:'FORI0003', name:'Persona y Sociedad', sem:5, req:['FORI0002']},
        // SEMESTRE 6
        {id:'DBIO1096', name:'Farmacología II', sem:6, req:['DBIO1097']},
        {id:'QYFAF001', name:'Tecnología Farm. II', sem:6, req:['QYFAE001']},
        {id:'QYFAF002', name:'Química Farm. II', sem:6, req:['QYFAE002']},
        {id:'DBIO0002', name:'Bioética', sem:6, req:['FORI0002']},
        {id:'ELECT001', name:'Electivo I', sem:6, req:[]},
        // SEMESTRE 7
        {id:'QYFAG003', name:'Farmacia Clínica I', sem:7, req:['DBIO1096']},
        {id:'QYFAG002', name:'Farmacognosia', sem:7, req:['DBIO1094']},
        {id:'QYFAH001', name:'Control de Calidad', sem:7, req:['DQUI1054','QYFAE001']},
        {id:'QYFAH002', name:'Legislación Farm.', sem:7, req:['QYFAE001']},
        {id:'QYFAG001', name:'Práctica I', sem:7, req:['QYFAE001']},
        {id:'DSPU0011', name:'Metodología Invest.', sem:7, req:['DCEX0005']},
        // SEMESTRE 8
        {id:'QYFAH003', name:'Farmacia Clínica II', sem:8, req:['QYFAG003']},
        {id:'QYFAH005', name:'Biofarmacia', sem:8, req:['QYFAF001','DBIO1096']},
        {id:'QYFAH006', name:'Toxicología', sem:8, req:['DBIO1096','DBIO1094']},
        {id:'QYFAH004', name:'Farmacia Asistencial', sem:8, req:['QYFAG003']},
        {id:'QYFAH007', name:'Hito Integrativo', sem:8, req:[]}, // req complejo, lo dejamos abierto o manual
        // SEMESTRE 9
        {id:'QYFAJ001', name:'Gestión y Marketing', sem:9, req:['QYFAH004']},
        {id:'QYFAJ002', name:'Farmacovigilancia', sem:9, req:['QYFAG003']},
        {id:'ELECP001', name:'Electivo Profesional I', sem:9, req:[]},
        // SEMESTRE 10
        {id:'QYFAK003', name:'Práctica II (Comunitaria)', sem:10, req:['QYFAG001','QYFAH004']},
        {id:'QYFAK001', name:'Internado', sem:10, req:[]}
    ];

    // --- STATE ---
    let state = { passed: [], current: [], data: {} };

    function init() {
        const stored = localStorage.getItem('pharmacyQuestSave');
        if(stored) {
            state = JSON.parse(stored);
            renderActive();
            renderMap();
        } else {
            // SI ES PRIMERA VEZ, LANZAR SETUP
            launchSetup();
        }
    }

    function save() {
        localStorage.setItem('pharmacyQuestSave', JSON.stringify(state));
    }

    // --- SETUP INICIAL ---
    function launchSetup() {
        const list = document.getElementById('setup-list');
        list.innerHTML = '';
        // Mostrar solo hasta semestre 6 para no saturar, o todo
        db.forEach(sub => {
            list.innerHTML += `
                <div style="margin-bottom:5px;">
                    <input type="checkbox" value="${sub.id}" id="chk-${sub.id}" style="width:auto;">
                    <label for="chk-${sub.id}">${sub.name} (${sub.id})</label>
                </div>
            `;
        });
        document.getElementById('setup-modal').classList.add('open');
    }

    function finishSetup() {
        const chks = document.querySelectorAll('#setup-list input:checked');
        chks.forEach(c => state.passed.push(c.value));
        save();
        document.getElementById('setup-modal').classList.remove('open');
        renderActive();
        renderMap();
    }

    // --- RENDER ACTIVE (DASHBOARD) ---
    function renderActive() {
        const con = document.getElementById('active-container');
        con.innerHTML = '';
        
        if(state.current.length === 0) {
            con.innerHTML = '<p style="text-align:center; padding:20px;">NO HAY MISIONES EN CURSO.<br>VE AL MAPA PARA EQUIPARTE.</p>';
            return;
        }

        state.current.forEach(code => {
            const sub = db.find(s => s.id === code);
            if(!sub) return;
            const avg = getAvg(code);
            const hpPercent = Math.min(100, (avg / 7.0) * 100);
            
            con.innerHTML += `
                <div class="pixel-box" onclick="openModal('${code}')">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--gold)">${sub.name}</span>
                        <span>HP: ${avg || '??'}</span>
                    </div>
                    <div class="hp-bar-container">
                        <div class="hp-bar" style="width:${hpPercent}%; background:${avg < 4.0 ? 'var(--danger)' : 'var(--success)'}"></div>
                        <div class="hp-text">${sub.id}</div>
                    </div>
                </div>
            `;
        });
    }

    // --- RENDER MAP (MALLA) ---
    function renderMap() {
        const con = document.getElementById('map-container');
        con.innerHTML = '';

        // Agrupar por semestres
        const sems = {};
        db.forEach(s => {
            if(!sems[s.sem]) sems[s.sem] = [];
            sems[s.sem].push(s);
        });

        for(let i=1; i<=10; i++) {
            if(!sems[i]) continue;
            
            const section = document.createElement('div');
            section.className = 'semester-block';
            section.innerHTML = `<div class="sem-title">NIVEL ${i}</div>`;
            
            const list = document.createElement('div');
            list.className = 'pixel-box';
            
            sems[i].forEach(sub => {
                const isPassed = state.passed.includes(sub.id);
                const isCurrent = state.current.includes(sub.id);
                
                // Verificar requisitos
                const missingReqs = sub.req.filter(r => !state.passed.includes(r));
                const isLocked = missingReqs.length > 0 && !isPassed && !isCurrent;
                
                let icon = '❓';
                let statusClass = '';

                if(isPassed) { icon = '🏆'; statusClass = 'st-passed'; }
                else if(isCurrent) { icon = '⚔️'; statusClass = 'st-active'; }
                else if(isLocked) { icon = '🔒'; statusClass = 'st-locked'; }
                else { icon = '💎'; statusClass = 'st-available'; }

                list.innerHTML += `
                    <div class="course-row ${statusClass}" onclick="handleMapClick('${sub.id}', ${isLocked}, '${missingReqs.join(',')}')">
                        <div class="course-status">${icon}</div>
                        <div class="course-info">
                            <div class="course-name">${sub.name}</div>
                            <div class="course-code">${sub.id}</div>
                        </div>
                    </div>
                `;
            });
            
            section.appendChild(list);
            con.appendChild(section);
        }
    }

    // --- INTERACCIÓN ---
    let activeSub = null;

    function handleMapClick(id, isLocked, missing) {
        activeSub = id;
        const sub = db.find(s => s.id === id);
        const isCurrent = state.current.includes(id);
        const isPassed = state.passed.includes(id);

        // Configurar Modal
        document.getElementById('d-title').innerText = sub.name;
        document.getElementById('d-code').innerText = sub.id;

        const gradeSec = document.getElementById('d-grades-section');
        const enrollSec = document.getElementById('d-enroll-section');
        const btnForce = document.getElementById('btn-force');
        const lockMsg = document.getElementById('d-lock-msg');
        const btnEnroll = document.getElementById('btn-enroll');

        if(isCurrent || isPassed) {
            // Modo Notas
            gradeSec.style.display = 'block';
            enrollSec.style.display = 'none';
            renderEvals();
        } else {
            // Modo Inscripción
            gradeSec.style.display = 'none';
            enrollSec.style.display = 'block';
            
            if(isLocked) {
                lockMsg.innerHTML = `BLOQUEADO POR: ${missing}<br>¿Usar Cheat Code?`;
                btnEnroll.style.display = 'none';
                btnForce.style.display = 'inline-block';
            } else {
                lockMsg.innerText = "MISIÓN DISPONIBLE";
                btnEnroll.style.display = 'inline-block';
                btnForce.style.display = 'none';
            }
        }

        document.getElementById('detail-modal').classList
